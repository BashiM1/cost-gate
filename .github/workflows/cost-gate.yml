name: Cost Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "examples/demo-tf/**"
      - "src/**"
      - "terraform/**"
      - ".github/workflows/cost-gate.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  cost-gate:
    # Run on PR opens/syncs, on merge (closed + merged=true), and manual
    # dispatch. Skip closed-without-merge — there is no signal value.
    if: github.event_name == 'workflow_dispatch' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      TF_DIR: examples/demo-tf
      THRESHOLD_USD_MONTHLY: "100"
    steps:
      - uses: actions/checkout@v4

      # Authenticate before terraform plan so the google provider can
      # initialize via ADC. Default token_format=access_token also
      # leaves gcloud usable for the ID-token step further down.
      - id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init / plan / show
        working-directory: ${{ env.TF_DIR }}
        env:
          # Plan-only — no AWS API calls. The provider still needs *some*
          # creds to initialize even with skip_credentials_validation.
          AWS_ACCESS_KEY_ID: noop-plan-only
          AWS_SECRET_ACCESS_KEY: noop-plan-only
          AWS_REGION: eu-west-2
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          terraform init -backend=false -input=false
          terraform plan -input=false -refresh=false -out=plan.bin
          terraform show -json plan.bin > plan.json

      - name: Build cost-gate request body
        id: build
        env:
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          plan = json.load(open(f"{os.environ['TF_DIR']}/plan.json"))
          pc = plan.get("configuration", {}).get("provider_config", {}) or {}
          regions = {}
          for key in ("aws", "google"):
              try:
                  regions[key] = pc[key]["expressions"]["region"]["constant_value"]
              except (KeyError, TypeError):
                  pass
          # Fallback per the contract — never POST without regions populated.
          regions.setdefault("aws", "eu-west-2")
          regions.setdefault("google", "us-central1")

          body = {
              "pr_context": {
                  "repository": os.environ["PR_REPO"],
                  "pr_number": int(os.environ["PR_NUMBER"]),
                  "head_sha": os.environ["PR_SHA"],
                  "actor": os.environ["PR_ACTOR"],
              },
              "threshold_usd_monthly": float(os.environ["THRESHOLD_USD_MONTHLY"]),
              "provider_regions": regions,
              "terraform_plan": plan,
          }
          pathlib.Path("request.json").write_text(json.dumps(body))
          print(f"provider_regions={regions}")
          PY

      - name: POST to cost-gate
        id: post
        run: |
          set -euo pipefail
          # `--audiences` requires regular SA creds; under WIF gcloud holds an
          # external-account credential, so impersonate the CI SA explicitly
          # (the SA has roles/iam.serviceAccountTokenCreator on itself, set in
          # terraform/wif.tf:ci_self_token_creator).
          ID_TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${{ vars.CI_SERVICE_ACCOUNT }}" \
            --audiences="${{ vars.COST_GATE_URL }}")
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${{ vars.COST_GATE_URL }}/api/v1/cost-estimate" \
            -H "authorization: Bearer ${ID_TOKEN}" \
            -H 'content-type: application/json' \
            --data-binary @request.json)
          echo "http_code=${http_code}" >> "$GITHUB_OUTPUT"
          if [ "${http_code}" != "200" ]; then
            echo "::error::cost-gate returned HTTP ${http_code}"
            cat response.json
            exit 1
          fi
          {
            echo "summary<<EOF"
            python3 -c "import json; print(json.load(open('response.json'))['summary_markdown'])"
            echo "EOF"
            python3 -c "import json; r=json.load(open('response.json')); print(f\"breached={str(r['threshold_breached']).lower()}\"); print(f\"total={r['total_monthly_cost_usd']}\")"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        # Don't comment on closed/merged PRs — the comment thread is settled.
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          # Pass via env, not template-literal interpolation — the summary
          # markdown contains backticks for inline code (`aws_instance.demo`)
          # which would break out of the JS template literal otherwise.
          SUMMARY: ${{ steps.post.outputs.summary }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: process.env.SUMMARY,
            });

      - name: Notify Slack on merge breach
        # Fires only on a merge event with confirmed breach. Re-uses the
        # response.json body the cost-estimate POST step already saved.
        if: >
          github.event_name == 'pull_request' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          steps.post.outputs.breached == 'true'
        run: |
          set -euo pipefail
          ID_TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${{ vars.CI_SERVICE_ACCOUNT }}" \
            --audiences="${{ vars.COST_GATE_URL }}")
          http_code=$(curl -sS -o notify-resp.json -w '%{http_code}' \
            -X POST "${{ vars.COST_GATE_URL }}/api/v1/notify-merge" \
            -H "authorization: Bearer ${ID_TOKEN}" \
            -H 'content-type: application/json' \
            --data-binary @response.json)
          if [ "${http_code}" != "200" ]; then
            echo "::error::notify-merge returned HTTP ${http_code}"
            cat notify-resp.json
            exit 1
          fi

      - name: Fail on threshold breach
        if: steps.post.outputs.breached == 'true'
        run: |
          echo "::error::Cost threshold breached: \$${{ steps.post.outputs.total }}/mo"
          exit 1
